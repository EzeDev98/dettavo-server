spring.application.name=dettavo

# Loopback only: nothing outside this Mac can reach the server.
server.address=127.0.0.1
server.port=${PORT:2060}
spring.threads.virtual.enabled=true

# Uploads are streamed raw, so Tomcat must not parse or spool multipart bodies.
spring.servlet.multipart.enabled=false
server.tomcat.max-swallow-size=-1

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# Swagger UI and the OpenAPI document are switched on by the dev profile only.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.workspace-dir=${APP_WORKSPACE_DIR:${user.home}/Dettavo}

# An empty tool path means "find it in app.tools.search-path".
app.tools.ffmpeg=${FFMPEG_PATH:}
app.tools.ffprobe=${FFPROBE_PATH:}
app.tools.whisper-cli=${WHISPER_CLI_PATH:}
app.tools.whisper-model=${WHISPER_MODEL_PATH:${user.home}/Dettavo/models/ggml-small.en.bin}
app.tools.search-path=/opt/homebrew/bin,/usr/local/bin,/usr/bin

app.transcription.chunk-minutes=10
app.transcription.overlap-seconds=2
app.transcription.threads=${WHISPER_THREADS:4}
app.transcription.language=en
# Step 10b: whether to use DTW token times (needs flash attention off), and the repetition-loop guard:
# none, max-context-zero (-mc 0) or vad (--vad with the Silero model). -mc 0 stops whisper from merging retakes of the
# same sentence into one, so every take is transcribed and can be cut.
app.transcription.dtw=false
app.transcription.loop-guard=max-context-zero
app.transcription.vad-model=${user.home}/Dettavo/models/ggml-silero-v5.1.2.bin
# Beam search width (-bs); 0 keeps whisper's greedy decoding. 5 keeps more repeated words, at some cost in speed.
app.transcription.beam-size=${WHISPER_BEAM_SIZE:5}
# Step 10e, guide 6.4: pause refinement on 10 ms energy frames.
app.transcription.noise-percentile=20
app.transcription.speech-factor=3.0
app.transcription.hangover-ms=20
app.transcription.lead-in-ms=20
# How far a word's edge may move onto its own sound: far enough to undo whisper stretching a word over a long silence.
app.transcription.max-edge-shift-ms=10000
# Step 10f, guide 6.5: a paragraph ends after a sentence followed by this much silence, or at this many words.
app.transcription.paragraph-pause-ms=1500
app.transcription.paragraph-max-words=120
app.peaks.per-second=100
app.proxy.height=720
app.edit.default-padding-ms=30
app.edit.min-keep-segment-ms=20
app.export.audio-fade-ms=10
app.jobs.max-concurrent-heavy=1
app.disk.reserve-bytes=2147483648

app.security.allowed-hosts=127.0.0.1,localhost
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:2061}
